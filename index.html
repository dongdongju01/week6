<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브 카페 - 주문서</title>
  <!-- 스타일시트 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 페이지 상단: 카페 소개 및 헤더 -->
  <header>
    <div class="logo">☕</div>
    <h1>바이브 카페</h1>
    <p>당신의 하루에 바이브를 더하다</p>

    <!-- 탭 메뉴 (주문하기 / 주문 내역) -->
    <nav class="tab-menu" aria-label="메인 메뉴">
      <button type="button" class="tab-btn active" id="tab-order">☕ 주문하기</button>
      <button type="button" class="tab-btn" id="tab-history">
        📋 주문 내역 <span class="badge" id="order-badge">0</span>
      </button>
    </nav>
  </header>

  <main>
    <!-- 탭 1: 주문하기 화면 (주문서 및 확인 메시지) -->
    <section id="section-order" class="tab-content">
      <!-- 주문서 양식 (유효성 검사는 JavaScript로 처리하기 위해 novalidate 추가) -->
      <form id="order-form" novalidate>
        <!-- 1. 이름 (필수 입력) -->
        <div class="form-group">
          <label for="customer-name">이름</label>
          <input type="text" id="customer-name" name="customerName" required>
        </div>

      <!-- 2. 전화번호 -->
      <div class="form-group">
        <label for="customer-phone">전화번호</label>
        <input type="tel" id="customer-phone" name="customerPhone">
      </div>

      <!-- 3. 음료 선택 (드롭다운) -->
      <div class="form-group">
        <label for="drink-select">음료 선택</label>
        <select id="drink-select" name="drink">
          <option value="">-- 음료를 선택하세요 --</option>
          <option value="americano" data-price="3500">아메리카노 (3,500원)</option>
          <option value="latte" data-price="4000">카페라떼 (4,000원)</option>
          <option value="mocha" data-price="4500">카페모카 (4,500원)</option>
          <option value="vanilla-latte" data-price="4500">바닐라라떼 (4,500원)</option>
          <option value="green-tea-latte" data-price="4500">녹차라떼 (4,500원)</option>
          <option value="sweetphotaoto-latte" data-price="4500">고구마라떼 (4,500원)</option>
        </select>
      </div>

      <!-- 4. 사이즈 (라디오 버튼) -->
      <fieldset class="form-group">
        <legend>사이즈</legend>
        <div>
          <input type="radio" id="size-s" name="size" value="S" data-price="0">
          <label for="size-s">S (+0원)</label>
        </div>
        <div>
          <input type="radio" id="size-m" name="size" value="M" data-price="500" checked>
          <label for="size-m">M (+500원)</label>
        </div>
        <div>
          <input type="radio" id="size-l" name="size" value="L" data-price="1000">
          <label for="size-l">L (+1,000원)</label>
        </div>
      </fieldset>

      <!-- 5. 추가 옵션 (체크박스) -->
      <fieldset class="form-group">
        <legend>추가 옵션</legend>
        <div>
          <input type="checkbox" id="option-shot" name="options" value="shot" data-price="500">
          <label for="option-shot">샷 추가 (+500원)</label>
        </div>
        <div>
          <input type="checkbox" id="option-cream" name="options" value="cream" data-price="500">
          <label for="option-cream">크림 추가 (+500원)</label>
        </div>
        <div>
          <input type="checkbox" id="option-syrup" name="options" value="syrup" data-price="300">
          <label for="option-syrup">시럽 추가 (+300원)</label>
        </div>
        <div>
          <input type="checkbox" id="option-decaf" name="options" value="decaf" data-price="0">
          <label for="option-decaf">디카페인 (+0원)</label>
        </div>
        <div>
          <input type="checkbox" id="option-extra-ice" name="options" value="extra-ice" data-price="0">
          <label for="option-extra-ice">얼음 많이 (+0원)</label>
        </div>
      </fieldset>

      <!-- 6. 수량 -->
      <div class="form-group">
        <label for="quantity">수량</label>
        <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
      </div>

      <!-- 7. 요청사항 -->
      <div class="form-group">
        <label for="requests">요청사항</label>
        <textarea id="requests" name="requests" rows="4"></textarea>
      </div>

      <!-- 8. 예상 금액 표시 영역 -->
      <div id="total-price-area" class="price-area">
        예상 금액: 0원
      </div>

      <!-- 9 & 10. 주문하기 및 다시 작성 버튼 -->
      <div class="button-group">
        <button type="submit" id="submit-btn">주문하기</button>
        <button type="reset" id="reset-btn">다시 작성</button>
      </div>
    </form>

    <!-- 11. 주문 확인 메시지 표시 영역 (초기 상태 숨김) -->
    <div id="order-confirmation" class="confirmation-area" hidden></div>
    </section>

    <!-- 탭 2: 주문 내역 화면 (초기 상태 숨김) -->
    <section id="section-history" class="tab-content hidden">
      <!-- 주문 내역 카드들이 렌더링될 컨테이너 -->
      <div id="order-list" class="order-list"></div>

      <!-- 주문 내역 하단 요약 및 전체 삭제 영역 -->
      <div id="history-footer" class="history-footer">
        <div id="history-summary" class="history-summary">총 주문 금액: 0원 (0건)</div>
        <button type="button" id="clear-history-btn" class="clear-btn">내역 모두 지우기</button>
      </div>
    </section>
  </main>

  <!-- Supabase JS v2 CDN 연결 (script.js보다 먼저 로드) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 자바스크립트 연결 -->
  <script src="script.js"></script>
</body>
</html>
